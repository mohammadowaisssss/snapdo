server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Self-contained MIME types table so Nginx never depends on host /etc/mime.types (e.g., on Arch Linux)
    types {
        text/html                                        html htm shtml;
        text/css                                         css;
        text/javascript                                  js mjs cjs;
        application/json                                 json map topojson;
        application/manifest+json                        webmanifest;
        application/wasm                                 wasm;
        image/svg+xml                                    svg svgz;
        image/png                                        png;
        image/jpeg                                       jpeg jpg;
        image/gif                                        gif;
        image/webp                                       webp;
        image/avif                                       avif;
        image/x-icon                                     ico cur;
        font/woff                                        woff;
        font/woff2                                       woff2;
        font/ttf                                         ttf;
        font/otf                                         otf;
        text/plain                                       txt;
        text/xml                                         xml;
        application/pdf                                  pdf;
        video/mp4                                        mp4;
        video/webm                                       webm;
        audio/mpeg                                       mp3;
        audio/ogg                                        ogg;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Allow 15MB file uploads for task and comment attachments
    client_max_body_size 15M;

    # Gzip compression for fast UI asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Reverse-proxy all /api/* requests to the Backend container
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Explicit Content-Type enforcement for ES module JavaScript files (.js / .mjs)
    location ~* \.(?:js|mjs|cjs)$ {
        default_type text/javascript;
        add_header Content-Type "text/javascript; charset=utf-8" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Explicit Content-Type enforcement for stylesheets (.css)
    location ~* \.css$ {
        default_type text/css;
        add_header Content-Type "text/css; charset=utf-8" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cache immutable hashed static assets from Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA Router Fallback (only for non-asset routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

